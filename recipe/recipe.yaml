schema_version: 1

context:
  name: opentelemetry-instrumentation-threading
  version: "0.66b2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_threading-${{ version }}.tar.gz
  sha256: 512e0d4b568eff36ca15a977b507ddc1e64a38f93dbcafa4e701b3555b066991

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.12,<2.dev0
    - opentelemetry-instrumentation ==${{ version }}
    - wrapt >=1.0.0,<3.0.0

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.threading
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Thread context propagation support for OpenTelemetry
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://opentelemetry.io
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-threading
  documentation: https://opentelemetry-python-contrib.readthedocs.io/en/latest/instrumentation/threading/threading.html

extra:
  recipe-maintainers:
    - timkpaine
